configurations:
  - name: dev-workstation
    description: CLI tooling for engineering endpoints
    targetDistros:
      - Debian
      - Ubuntu
    packages:
      - name: git
        present: true
        packageManager: apt
      - name: jq
        present: true
        packageManager: apt
      - name: htop
        present: true
        packageManager: apt
      - name: build-essential
        present: true
        packageManager: apt
      - name: curl
        present: true
        packageManager: apt
