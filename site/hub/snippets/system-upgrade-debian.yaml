crons:
  - name: system-upgrade-debian
    description: Full package upgrade for Debian and Ubuntu (apt)
    schedule: "0 0 * * 0"
    targetDistros:
      - Debian
      - Ubuntu
    commands:
      - name: apt-update
        apply: [apt-get, update, -y]
      - name: apt-upgrade
        apply: [apt-get, upgrade, -y, -q]
        dependsOn: [system-upgrade-debian/apt-update]
