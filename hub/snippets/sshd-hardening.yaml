kind: module
schemaVersion: 1
configurations:
  - name: ssh-hardening
    description: Manage a validated OpenSSH server hardening drop-in
    targetDistros: [Debian, Ubuntu, Arch]
    resources:
      - kind: file
        name: sshd-hardening-conf
        path: /etc/ssh/sshd_config.d/99-remotr-hardening.conf
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
        preApplyValidation:
          - /usr/sbin/sshd
          - -t
