configurations:
  - name: ssh-hardening
    description: Baseline sshd restrictions for fleet endpoints
    targetDistros:
      - Debian
      - Ubuntu
      - Arch
    files:
      - name: sshd-hardening-conf
        path: /etc/ssh/sshd_config.d/99-remotr-hardening.conf
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
        mode: [0644]
    commands:
      - name: sshd-reload
        apply: [systemctl, reload, sshd]
        dependsOn: [ssh-hardening/sshd-hardening-conf]
