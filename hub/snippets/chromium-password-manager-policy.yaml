kind: module
schemaVersion: 1
configurations:
  - name: chromium-password-manager-policy
    description: Disable Chromium password storage when credentials are managed elsewhere
    targetDistros: [Debian, Ubuntu, Arch]
    resources:
      - kind: browserPolicy
        name: disable-password-manager
        browser: chromium
        policyName: PasswordManagerEnabled
        scope: system
        level: mandatory
        lifecycle: present
        value:
          type: boolean
          value: false
