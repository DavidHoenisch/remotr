kind: module
schemaVersion: 1
configurations:
  - name: application-logrotate
    description: Rotate application logs with bounded retention; customize the path for your service
    targetDistros: [Debian, Ubuntu, Arch]
    resources:
      - kind: logrotate
        name: application-logs
        paths: [/var/log/myapp/*.log]
        cadence: daily
        retention: 14
        compress: true
        create:
          mode: "0640"
          owner: root
          group: root
