kind: module
schemaVersion: 1
configurations:
  - name: base-packages-debian
    description: Base packages for Debian and Ubuntu endpoints
    targetDistros: [Debian, Ubuntu]
    resources:
      - kind: package
        name: curl
        lifecycle: present
        packageManager: apt
  - name: base-packages-arch
    description: Base packages for Arch endpoints
    targetDistros: [Arch]
    resources:
      - kind: package
        name: curl
        lifecycle: present
        packageManager: pacman
