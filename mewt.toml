## Pinned Mewt 3.0.1 pilot configuration. See docs/testing/mutation-testing-pilot.md
## for artifact verification, licensing, scope, and campaign policy.
db = "test/mutation/mewt.sqlite"

[log]
level = "info"

[targets]
include = [
  "internal/configrepo/repo.go",
  "internal/capabilitymatrix/matrix.go",
  "internal/changecontrol/registry.go",
  "internal/changecontrol/lease.go",
  "internal/changecontrol/breakglass.go",
  "internal/rbac/rbac.go",
  "internal/agent/engine/engine.go",
  "internal/executor/activation.go",
  "internal/executor/safe_value.go",
  "internal/effectivehash/hash.go",
  "internal/resourceregistry/fields.go",
  "internal/resourceregistry/safe_projection.go",
  "internal/rollbackstore/reservation.go",
  "internal/rollbackstore/store.go",
  "internal/rollbackstore/retention.go",
  "internal/apppackages/manifest.go",
  "internal/diagnostics/bundle.go",
  "internal/server/diagnostics.go",
  "internal/store/postgres/diagnostics.go",
  "internal/secrets/envelope.go",
  "internal/secrets/lifecycle.go",
  "internal/secrets/registry.go",
  "internal/secrets/secret.go",
]
ignore = ["vendor", "testdata", "_test.go"]

[run]
# Favor branch, comparison, error, and logical changes in the first pilot.
mutations = ["BL", "COS", "CR", "ER", "IF", "IT", "LOS"]

[test]
[[test.per_target]]
glob = "internal/configrepo/repo.go"
cmd = "go test -mod=vendor ./internal/configrepo ./internal/scaffold"
timeout = 30

[[test.per_target]]
glob = "internal/capabilitymatrix/matrix.go"
cmd = "go test -mod=vendor ./internal/capabilitymatrix ./internal/configrepo"
timeout = 30

[[test.per_target]]
glob = "internal/changecontrol/*.go"
cmd = "go test -mod=vendor ./internal/changecontrol ./internal/server"
timeout = 30

[[test.per_target]]
glob = "internal/rbac/rbac.go"
cmd = "go test -mod=vendor ./internal/rbac"
timeout = 30

[[test.per_target]]
glob = "internal/agent/engine/engine.go"
cmd = "go test -mod=vendor ./internal/agent/engine"
timeout = 30

[[test.per_target]]
glob = "internal/executor/activation.go"
cmd = "go test -mod=vendor ./internal/executor ./internal/agent/engine"
timeout = 30

[[test.per_target]]
glob = "internal/executor/safe_value.go"
cmd = "go test -mod=vendor ./internal/executor ./internal/resourceregistry"
timeout = 30

[[test.per_target]]
glob = "internal/effectivehash/hash.go"
cmd = "go test -mod=vendor ./internal/effectivehash ./internal/resourceregistry ./internal/configcompose ./internal/changecontrol ./internal/server"
timeout = 30

[[test.per_target]]
glob = "internal/resourceregistry/fields.go"
cmd = "go test -mod=vendor ./internal/resourceregistry ./internal/configcompose"
timeout = 30

[[test.per_target]]
glob = "internal/resourceregistry/safe_projection.go"
cmd = "go test -mod=vendor ./internal/resourceregistry ./internal/executor"
timeout = 30

[[test.per_target]]
glob = "internal/rollbackstore/reservation.go"
cmd = "go test -mod=vendor ./internal/rollbackstore ./internal/agent/networkstate"
timeout = 30

[[test.per_target]]
glob = "internal/rollbackstore/store.go"
cmd = "go test -mod=vendor ./internal/rollbackstore ./internal/agent/networkstate"
timeout = 30

[[test.per_target]]
glob = "internal/rollbackstore/retention.go"
cmd = "go test -mod=vendor ./internal/rollbackstore"
timeout = 30

[[test.per_target]]
glob = "internal/apppackages/manifest.go"
cmd = "go test -mod=vendor ./internal/apppackages"
timeout = 30

[[test.per_target]]
glob = "internal/diagnostics/bundle.go"
cmd = "go test -mod=vendor ./internal/diagnostics ./internal/agent/diagnostics"
timeout = 30

[[test.per_target]]
glob = "internal/server/diagnostics.go"
cmd = "go test -mod=vendor ./internal/server"
timeout = 30

[[test.per_target]]
glob = "internal/store/postgres/diagnostics.go"
cmd = "go test -mod=vendor ./internal/store/postgres"
timeout = 30

[[test.per_target]]
glob = "internal/secrets/envelope.go"
cmd = "go test -mod=vendor ./internal/secrets ./internal/server"
timeout = 30

[[test.per_target]]
glob = "internal/secrets/lifecycle.go"
cmd = "go test -mod=vendor ./internal/secrets ./internal/store/postgres ./cmd/remotr-server"
timeout = 30

[[test.per_target]]
glob = "internal/secrets/secret.go"
cmd = "go test -mod=vendor ./internal/secrets"
timeout = 30

[[test.per_target]]
glob = "internal/secrets/registry.go"
cmd = "go test -mod=vendor ./internal/secrets ./internal/server"
timeout = 30

# Mewt 3.0.1 resolves [test].cmd before per-target rules. A final catch-all
# rule therefore provides the comprehensive fallback without shadowing the
# focused package rules above.
[[test.per_target]]
glob = "**/*.go"
cmd = "go test -mod=vendor ./..."
timeout = 90
