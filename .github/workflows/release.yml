name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Install Linux desktop and Flatpak prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            appstream build-essential desktop-file-utils flatpak flatpak-builder \
            libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config \
            xauth x11-utils xvfb

      - name: Install pinned Flatpak runtime and SDK
        run: |
          sudo flatpak remote-add --system --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --system --noninteractive flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Build and verify Linux amd64 Flatpak release asset
        run: make desktop-flatpak-release-check DESKTOP_VERSION="${GITHUB_REF_NAME#v}"

      - name: Test
        run: go test -mod=vendor ./...

      - name: Traceability lint
        run: go run ./scripts/traceability-lint.go

      - name: Restore generated tracked desktop files
        run: |
          git restore --source=HEAD --worktree -- desktop/frontend/dist desktop/frontend/wailsjs
          git diff --exit-code

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
