name: Scheduled fuzz campaigns

on:
  schedule:
    - cron: '30 2 * * *'
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run all native fuzz targets (medium campaign)
        run: |
          set -o pipefail
          ./scripts/fuzz-all.sh 30s | tee fuzz-medium.log
      - name: Write medium campaign history
        if: always()
        run: printf '{"schemaVersion":1,"revision":"%s","duration":"30s","status":"%s"}\n' "$GITHUB_SHA" "${{ job.status }}" > fuzz-medium.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-medium-${{ github.run_id }}
          path: |
            fuzz-medium.log
            fuzz-medium.json
          retention-days: 90

  weekly:
    if: github.event.schedule == '0 3 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run all native fuzz targets (long campaign)
        run: |
          set -o pipefail
          ./scripts/fuzz-all.sh 2m | tee fuzz-long.log
      - name: Write long campaign history
        if: always()
        run: printf '{"schemaVersion":1,"revision":"%s","duration":"2m","status":"%s"}\n' "$GITHUB_SHA" "${{ job.status }}" > fuzz-long.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-long-${{ github.run_id }}
          path: |
            fuzz-long.log
            fuzz-long.json
          retention-days: 90
