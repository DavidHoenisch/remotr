name: Benchmark comparisons

on:
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/bench-*.sh'
      - 'scripts/performance-*.go'
      - 'test/performance/budgets.json'
      - 'test/benchmarkfixture/**'
  workflow_dispatch:
    inputs:
      controlled_runner:
        description: Run the reproducible collection on the labelled controlled runner
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  advisory:
    if: github.event_name == 'pull_request'
    # Shared-runner latency is advisory; deterministic allocations and payload
    # sizes are blocking according to the versioned policy.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Collect base and pull-request samples
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BENCH_COUNT: '6'
        run: |
          set -euo pipefail
          mkdir -p artifacts/benchmarks
          git checkout --detach "$BASE_SHA"
          go test -mod=vendor -run='^$' -bench=. -benchmem -count="$BENCH_COUNT" \
            ./internal/models ./internal/configrepo ./internal/configcompose ./internal/apppackages \
            ./internal/capabilitymatrix ./internal/agent/engine ./internal/agent/sync ./internal/executor \
            ./internal/registry ./internal/rollbackstore ./internal/secrets ./test/acceptance \
            > artifacts/benchmarks/base.txt
          git checkout --detach "$HEAD_SHA"
          go test -mod=vendor -run='^$' -bench=. -benchmem -count="$BENCH_COUNT" \
            ./internal/models ./internal/configrepo ./internal/configcompose ./internal/apppackages \
            ./internal/capabilitymatrix ./internal/agent/engine ./internal/agent/sync ./internal/executor \
            ./internal/registry ./internal/rollbackstore ./internal/secrets ./test/acceptance \
            > artifacts/benchmarks/head.txt
          ./scripts/bench-compare.sh artifacts/benchmarks/base.txt artifacts/benchmarks/head.txt artifacts/benchmarks/comparison
          go run -mod=vendor ./scripts/performance-relative-gate.go \
            artifacts/benchmarks/base.txt artifacts/benchmarks/head.txt \
            > artifacts/benchmarks/deterministic-gate.json
      - name: Publish advisory comparison
        if: always()
        run: |
          if [[ -d artifacts/benchmarks/comparison ]]; then
            cat artifacts/benchmarks/comparison/*.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-advisory-${{ github.run_id }}
          path: artifacts/benchmarks/
          if-no-files-found: warn
          retention-days: 14

  controlled:
    if: github.event_name == 'workflow_dispatch' && inputs.controlled_runner
    runs-on: [self-hosted, remotr-benchmark]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Collect controlled-runner benchmark evidence
        env:
          BENCH_COUNT: '10'
          REMOTR_BENCH_DATABASE_URL: postgres://remotr:remotr@127.0.0.1:5432/remotr?sslmode=disable
        run: |
          set -euo pipefail
          make compose-up
          ./scripts/bench-collect.sh artifacts/benchmarks/controlled.txt
          make benchmark-foundation-controlled > artifacts/benchmarks/foundation-controlled.txt
          make performance-budget-lint
          make performance-benchmark-gate BENCHMARK_FILE=artifacts/benchmarks/foundation-controlled.txt \
            > artifacts/benchmarks/foundation-gate.json
      - name: Publish controlled-runner evidence
        run: |
          cat artifacts/benchmarks/controlled.txt >> "$GITHUB_STEP_SUMMARY"
          echo 'No shared-runner latency gate is inferred from this collection.' >> "$GITHUB_STEP_SUMMARY"
      - name: Capture bounded diagnostics after a controlled gate failure
        if: failure()
        run: |
          mkdir -p artifacts/benchmarks/diagnostics
          go build -mod=vendor -o artifacts/benchmarks/remotr-server ./cmd/remotr-server
          REMOTR_PROFILE_SECONDS=10 ./scripts/capture-performance-failure.sh \
            artifacts/benchmarks/diagnostics \
            artifacts/benchmarks/remotr-server \
            compose/docker-compose.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-controlled-${{ github.run_id }}
          path: artifacts/benchmarks/
          retention-days: 90
      - name: Tear down controlled benchmark database
        if: always()
        run: make compose-down
