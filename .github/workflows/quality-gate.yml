name: Pull request quality gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Deterministic Go quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve comparison base
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [[ -z "$base" ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install desktop package validation
        run: |
          sudo apt-get update
          sudo apt-get install --yes desktop-file-utils

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenSpec
        run: npm install --global @fission-ai/openspec@1.6.0

      - name: Strict OpenSpec validation
        run: openspec validate --all --strict --no-interactive

      - name: Traceability lint
        run: go run ./scripts/traceability-lint.go

      - name: Test policy check
        run: |
          go run ./scripts/test-policy-check.go
          mkdir -p artifacts
          quarantines="$(awk '$1 == "kind:" && $2 == "quarantine" { count++ } END { print count + 0 }' test/evidence-exceptions.yaml)"
          printf '{"schemaVersion":1,"revision":"%s","activeQuarantines":%s}\n' \
            "$GITHUB_SHA" "$quarantines" > artifacts/flaky-status.json

      - name: Mutation and performance policy lint
        run: make mutation-policy-lint

      - name: Check formatting
        run: test -z "$(gofmt -l $(find . -path ./vendor -prune -o -name '*.go' -print))"

      - name: Vet
        run: go vet -mod=vendor ./...

      - name: Test with coverage
        run: |
          set -euo pipefail
          mkdir -p artifacts
          make test-fuzz-seeds
          go test -count=1 -timeout=5m -json -mod=vendor -coverpkg=./... \
            -coverprofile=artifacts/coverage.out ./... | tee artifacts/test.json
          go tool cover -func=artifacts/coverage.out | tee artifacts/coverage-summary.txt
          coverage_args=(-profile artifacts/coverage.out)
          if [[ -n "$BASE_SHA" ]]; then
            coverage_args+=(-base "$BASE_SHA")
          fi
          go run ./scripts/coverage-report.go "${coverage_args[@]}" | tee artifacts/coverage-report.txt

      - name: Active fuzz for changed target packages
        run: ./scripts/fuzz-affected.sh "$BASE_SHA" 10s

      - name: Race detector
        run: |
          set -euo pipefail
          mkdir -p artifacts
          go test -count=1 -timeout=5m -json -mod=vendor -race ./... \
            | tee artifacts/race.json

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90

  critical-mutation:
    name: Changed critical-logic mutation gate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Resolve changed critical targets
        id: mutation_scope
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if [[ -z "$base" ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          mkdir -p artifacts/mutation
          : > artifacts/mutation/changed-targets.txt
          while IFS= read -r target; do
            if ! git diff --quiet "$base"...HEAD -- "$target"; then
              printf '%s\n' "$target" >> artifacts/mutation/changed-targets.txt
            fi
          done < <(sed -E '/^[[:space:]]*(#|$)/d' test/mutation/critical-targets.txt)
          count="$(wc -l < artifacts/mutation/changed-targets.txt)"
          printf '{"schemaVersion":1,"base":"%s","changedCriticalTargets":%s}\n' \
            "$base" "$count" > artifacts/mutation/scope.json
          if [[ "$count" -gt 0 ]]; then
            echo 'has_targets=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_targets=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install verified isolated mutation tool
        if: steps.mutation_scope.outputs.has_targets == 'true'
        run: echo "MEWT=$(./scripts/install-mewt.sh "$RUNNER_TEMP/mewt-3.0.1")" >> "$GITHUB_ENV"
      - name: Reject unexplained high-severity survivors
        if: steps.mutation_scope.outputs.has_targets == 'true'
        env:
          MUTATION_TARGET_FILE: artifacts/mutation/changed-targets.txt
          MUTATION_EVIDENCE_FILE: artifacts/mutation/high-gate.json
        run: make mutation-high-gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: changed-critical-mutation-${{ github.run_id }}
          path: artifacts/mutation/
          if-no-files-found: error
          retention-days: 90
