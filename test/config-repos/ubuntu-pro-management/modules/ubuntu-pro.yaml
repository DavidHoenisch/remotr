kind: module
schemaVersion: 1
configurations:
  - name: ubuntu-pro
    description: Typed Ubuntu Pro capability-composition fixture
    targetDistros: [Ubuntu]
    targetArch: [X86]
    resources:
      - kind: ubuntuPro
        name: primary-subscription
        lifecycle: attached
        tokenRef: remotr:ubuntu-pro/production@active
        services:
          - name: esm-infra
            state: enabled
            enableMode: access-only
          - name: realtime-kernel
            state: enabled
            variant: raspi
          - name: livepatch
            state: disabled
            disableMode: purge
          - name: ros
            state: disabled
        landscape:
          state: enrolled
          accountName: production
          computerTitle: endpoint-hostname
          serverURL: https://landscape.example.test/message-system
          pingURL: https://landscape.example.test/ping
          tags: [production, remotr]
          accessGroup: linux-workstations
          registrationKeyRef: remotr:landscape/registration-key@active
          caRef: remotr:landscape/ca@active
        policy: report
        risk: sensitive
        authorizationGroup: ubuntu-pro-production
        enforce: false
