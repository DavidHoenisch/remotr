kind: module
schemaVersion: 1
configurations:
  - name: ubuntu-pro
    description: Typed Ubuntu Pro capability-composition fixture
    targetDistros: [Ubuntu]
    targetArch: [X86]
    resources:
      - kind: ubuntuPro
        name: primary-subscription
        lifecycle: attached
        tokenRef: remotr:ubuntu-pro/production@active
        services:
          - name: esm-apps
            state: enabled
            enableMode: full
        policy: report
        risk: sensitive
        authorizationGroup: ubuntu-pro-production
        enforce: false
