  expires: 2026-10-20
- id: EXC-025
  kind: equivalent-mutant
  owner: "@DavidHoenisch"
  issue: openspec:complete-core-package-providers#9.3
  reason: For every trimmed Go string, value == "" and value <= "" are equivalent because no non-empty string sorts below the empty string; AUR build-user admission cannot differ.
  equivalent_selector: mewt@3.0.1:internal/applicators/packages/aur/applicator.go:COS:build-user-empty
  expires: 2026-10-20
- id: EXC-026
  kind: equivalent-mutant
  owner: "@DavidHoenisch"
  issue: openspec:complete-core-package-providers#9.3
  reason: AUR user IDs are uint32 values, so uid == 0 and uid <= 0 are equivalent over the complete type domain.
  equivalent_selector: mewt@3.0.1:internal/applicators/packages/aur/applicator.go:COS:uid-zero
  expires: 2026-10-20
