crons:
  - name: clamav-scan-debian
    description: Update ClamAV virus definitions and scan user home directories (Debian/Ubuntu)
    schedule: "0 3 * * *"
    targetDistros:
      - Debian
      - Ubuntu
      - PopOS
    commands:
      - name: update-signatures
        # The service updates continuously and owns FreshClam's log lock.
        check: [systemctl, is-active, --quiet, clamav-freshclam.service]
        risk: normal
        apply: [freshclam, --quiet]
      - name: scan-homes
        check: [/usr/bin/false]
        risk: normal
        # Pass descriptors so the daemon can scan private user homes.
        apply: [clamdscan, --fdpass, /home]
        dependsOn: [clamav-scan-debian/update-signatures]

  - name: clamav-scan-arch
    description: Update ClamAV virus definitions and scan user home directories (Arch)
    schedule: "0 3 * * *"
    targetDistros:
      - Arch
    commands:
      - name: update-signatures
        # The service updates continuously and owns FreshClam's log lock.
        check: [systemctl, is-active, --quiet, clamav-freshclam.service]
        risk: normal
        apply: [freshclam, --quiet]
      - name: scan-homes
        check: [/usr/bin/false]
        risk: normal
        # Pass descriptors so the daemon can scan private user homes.
        apply: [clamdscan, --fdpass, /home]
        dependsOn: [clamav-scan-arch/update-signatures]
