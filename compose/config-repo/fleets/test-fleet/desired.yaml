configurations:
  - name: base-packages
    description: packages shared by e2e fleet
    targetDistros:
      - Debian
      - Arch
    packages:
      - name: curl
        present: true
        packageManager: apt
      - name: curl
        present: true
        packageManager: pacman
  - name: e2e-test-cli
    description: custom app package installed from MinIO via presigned URL
    targetDistros:
      - Debian
      - Arch
    customApps:
      - name: e2e-test-cli
        package: e2e/test-cli
        version: "1.0.0"
