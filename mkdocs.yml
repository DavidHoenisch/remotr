site_name: Remotr
site_description: Pull-based Linux MDM with GitOps desired state
site_url: https://davidhoenisch.github.io/remotr/
repo_url: https://github.com/DavidHoenisch/remotr
edit_uri: edit/master/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Learn:
    - tutorial/getting-started.md
  - Deploy:
    - guides/production-deployment.md
    - guides/fly-io.md
    - guides/installing-cli.md
    - guides/installing-agent.md
  - Operate:
    - guides/operator-overview.md
    - guides/bootstrap-operator.md
    - guides/enrollment-tokens.md
    - guides/endpoint-management.md
    - guides/git-sync-workflow.md
    - guides/rbac.md
    - guides/audit-logging.md
    - guides/config-validation.md
    - guides/agent-deployment.md
    - guides/configuration-repository.md
    - guides/custom-app-packages.md
    - guides/troubleshooting.md
  - Reference:
    - reference/configuration-format.md
    - reference/crons-format.md
    - reference/environment-variables.md
    - reference/http-api.md
  - Understand:
    - explanation/architecture.md
    - explanation/terminology.md
  - Runbooks:
    - runbooks/ca-rotation.md
  - Decisions:
    - adr/001-vendored-allowlist.md
    - adr/002-postgres-server-registry.md
    - adr/003-s3-app-packages.md
  - Contributing:
    - contributing/checklist.md

exclude_docs: |
  README.md
  guides/operator-workflows.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DavidHoenisch/remotr
  alternate:
    - name: Hub catalog
      link: hub/
